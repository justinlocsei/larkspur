name: Install Node.js

description: Set up Node.js and install npm dependencies

inputs:
  node-version:
    description: The Node.js version to use
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        cache: npm
        node-version: ${{ inputs.node-version }}

    - run: npm ci
      shell: bash
